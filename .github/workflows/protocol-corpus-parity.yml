# The mirror half of the protocol fixture corpus gate.
#
# `tests/fixtures/protocol/` is committed byte-identically in `mthds-js` and `mthds-python`: the
# reference engine's input-form descriptors and pipe I/O contracts, and beside them the inputs
# templates each repo's own client-side projection must produce from those descriptors. Nothing
# inside one mirror can see the other, so this job checks the sibling out and compares the two
# trees — which is what fails the pull request that would land a one-sided recapture, instead of
# leaving the drift for an unrelated `conformance` change to discover weeks later.
#
# THIS FILE IS A VENDORED COPY. The canonical one is
# `conformance/tests/mthds/fixtures/protocol_corpus_parity_workflow.yml`, and `make
# check-fixture-drift` there fails when a mirror's copy drifts from it. Edit the canonical copy
# and re-vendor both mirrors; do not edit this file in place. It is byte-identical in the two
# mirrors, which is why it derives which repo it is running in rather than naming one.
#
# It needs no secret: both mirrors are public, so the sibling checkout is unauthenticated and the
# job runs on a pull request from a fork exactly as it does on one from a branch.
#
# The comparison's authority is `conformance/scripts/check-protocol-fixture-parity.py` — the same
# tree, the same exclusions. That script runs over two checkouts in a workspace; the `diff` below
# is its shape in a single-repo CI job. The two exclusion sets are restated rather than shared,
# and a disagreement is caught rather than tolerated: an exclusion here the script does not have
# leaves the script red, and one the script has but this file does not leaves this job red.

name: Protocol corpus parity

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Protocol corpus parity
    runs-on: ubuntu-latest
    steps:
      - name: Resolve this mirror and its sibling
        id: mirror
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "${REPOSITORY##*/}" in
            mthds-js) sibling="${REPOSITORY%/*}/mthds-python" ;;
            mthds-python) sibling="${REPOSITORY%/*}/mthds-js" ;;
            *)
              echo "::error::${REPOSITORY} is not one of the two protocol corpus mirrors; this workflow is vendored into mthds-js and mthds-python only."
              exit 1
              ;;
          esac
          echo "sibling=${sibling}" >> "$GITHUB_OUTPUT"

      # A recapture lands as a pull request in each mirror at once, and each of the pair is red
      # against the other's `dev` until the first one merges. The pair shares a branch name, so
      # prefer the sibling's branch of that name and fall back to `dev` — which is what every
      # pull request that does not touch the corpus gets, and what the second of the pair gets
      # once the first has merged.
      - name: Resolve the sibling ref
        id: sibling
        env:
          SIBLING: ${{ steps.mirror.outputs.sibling }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          ref=dev
          if [ -n "${HEAD_REF}" ] && git ls-remote --exit-code --heads "https://github.com/${SIBLING}.git" "refs/heads/${HEAD_REF}" >/dev/null 2>&1; then
            ref="${HEAD_REF}"
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Comparing this pull request's corpus against ${SIBLING}@${ref}."

      - name: Checkout this mirror
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: mirror

      - name: Checkout the sibling mirror
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ steps.mirror.outputs.sibling }}
          ref: ${{ steps.sibling.outputs.ref }}
          path: sibling

      # `README.md` is per-repo prose and the `*.fixture.ts` twins are generated by `mthds-js`
      # alone; everything else in the tree is the shared artifact. Keep these exclusions in step
      # with EXCLUDED_NAMES / EXCLUDED_SUFFIXES in conformance's parity script.
      - name: Compare the two copies of the protocol fixture corpus
        env:
          SIBLING: ${{ steps.mirror.outputs.sibling }}
          SIBLING_REF: ${{ steps.sibling.outputs.ref }}
        run: |
          set -euo pipefail
          if diff --recursive --brief -x README.md -x '*.fixture.ts' mirror/tests/fixtures/protocol sibling/tests/fixtures/protocol; then
            echo "OK: the protocol fixture corpus is byte-identical to ${SIBLING}@${SIBLING_REF}."
          else
            echo "::error::The protocol fixture corpus differs from ${SIBLING}@${SIBLING_REF}. A capture lands in both mirrors or in neither: regenerate it with \`pipelex-dev generate-projection-corpus\` in the pipelex checkout, copy the tree into both repos (see tests/fixtures/protocol/README.md), and give the paired pull request the same branch name as this one so this job compares against it instead of against dev."
            exit 1
          fi
