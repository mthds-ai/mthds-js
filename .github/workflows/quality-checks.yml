# Runs `make all` (checks + tests) on every PR. Its status check is required
# by the branch-protection ruleset before anything can merge into main.
name: Quality Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    # The tests run the built CLIs; DO_NOT_TRACK keeps any of them from sending usage statistics
    # or method events from CI. The usage-statistics tests build their own environment instead.
    env:
      DO_NOT_TRACK: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: make install

      - name: Run quality checks and tests
        run: make all
